name: Deploy React site to S3

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/deploy.mjs"
      - ".github/workflows/deploy-s3.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gym-s3-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and sync to S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Optional repo variables. Empty values fall back to the defaults in
      # src/auth/oidcConfig.js (redirect URI = the page's own origin) and
      # src/auth/useApiClient.js (workouts API URL).
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
        run: npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsGymDeploy

      # scripts/deploy.mjs syncs dist/ with long-lived caching for hashed
      # assets and no-cache for index.html, then removes stale files.
      - name: Sync dist to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: node scripts/deploy.mjs
