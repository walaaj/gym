name: Lint frontend assets

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/lint-pr.yml"
      - ".htmlhintrc"
      - ".stylelintrc.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: HTML, CSS and JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint HTML
        run: |
          npx --yes htmlhint@1.6.3 --config .htmlhintrc index.html "dist/**/*.html"

      - name: Lint CSS
        run: |
          npx --yes stylelint@16 "src/**/*.css" --config .stylelintrc.json

      # dist/ holds minified production bundles that include vendor code
      # (e.g. React's scheduler), which trips structural rules such as
      # no-unreachable. Only rules meaningful for built output are enforced.
      - name: Run ESLint checks on JavaScript bundles
        run: |
          npx --yes eslint@9 "dist/**/*.js" \
            --no-config-lookup \
            --no-ignore \
            --rule "no-debugger:error"
